<div class="modal fade" id="projectModal" tabindex="-1" aria-labelledby="projectModalTitle" aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">

            <!-- MODAL HEADER -->
            <div class="modal-header">
                <h5 class="modal-title" id="projectModalTitle">
                    New Project
                </h5>

                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">
                </button>
            </div>

            <!-- PROJECT FORM -->
            <form id="projectForm" novalidate>

                <div class="modal-body">

                    <!-- PROJECT NAME -->
                    <div class="mb-3">
                        <label for="projectName" class="form-label">
                            Project Name
                        </label>

                        <input type="text" class="form-control" id="projectName" name="name"
                            placeholder="Enter project name" required>

                        <div class="invalid-feedback"></div>
                    </div>

                    <!-- DESCRIPTION -->
                    <div class="mb-3">
                        <label for="projectDescription" class="form-label">
                            Description
                        </label>

                        <textarea class="form-control" id="projectDescription" name="description" rows="4"
                            placeholder="Enter project description"></textarea>
                    </div>

                    <!-- STATUS -->
                    <div>
                        <label for="projectStatus" class="form-label">
                            Status
                        </label>

                        <select class="form-select" id="projectStatus" name="status">

                            <option value="active">Active</option>
                            <option value="completed">Completed</option>
                            <option value="archived">Archived</option>

                        </select>

                        <div class="invalid-feedback"></div>
                    </div>

                </div>

                <!-- MODAL FOOTER -->
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" id="projectCancelBtn">
                        Cancel
                    </button>

                    <button type="submit" class="btn btn-primary" id="projectSaveBtn">
                        Save Project
                    </button>
                </div>

            </form>

        </div>
    </div>
</div>
