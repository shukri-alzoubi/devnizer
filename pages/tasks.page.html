<section id="tasks-page">

    <!-- PAGE HEADER -->
    <header class="page-header d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">

        <div>
            <h1 class="h3 fw-bold mb-1">Tasks</h1>
            <p class="text-body-secondary mb-0">
                Manage and track your development tasks.
            </p>
        </div>

        <button type="button" class="btn btn-primary" id="newTaskBtn">
            <i class="bi bi-plus-lg me-2"></i>New Task
        </button>

    </header>

    <!-- TASK TOOLBAR -->
    <div class="row g-3 mb-4" id="taskToolbar">

        <!-- SEARCH -->
        <div class="col-12 col-xl">
            <div class="input-group">
                <span class="input-group-text bg-body">
                    <i class="bi bi-search"></i>
                </span>

                <input type="search" class="form-control" id="taskSearch" placeholder="Search tasks..."
                    aria-label="Search tasks">
            </div>
        </div>

        <!-- PROJECT FILTER -->
        <div class="col-12 col-sm-4 col-xl-auto">
            <select class="form-select" id="taskProjectFilter" aria-label="Filter tasks by project">

                <option value="all">All Projects</option>

            </select>
        </div>

        <!-- STATUS FILTER -->
        <div class="col-12 col-sm-4 col-xl-auto">
            <select class="form-select" id="taskStatusFilter" aria-label="Filter tasks by status">

                <option value="all">All Statuses</option>
                <option value="todo">To Do</option>
                <option value="in-progress">In Progress</option>
                <option value="done">Done</option>

            </select>
        </div>

        <!-- PRIORITY FILTER -->
        <div class="col-12 col-sm-4 col-xl-auto">
            <select class="form-select" id="taskPriorityFilter" aria-label="Filter tasks by priority">

                <option value="all">All Priorities</option>
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>

            </select>
        </div>

    </div>

    <!-- TASK VIEW CONTROLS -->
    <div class="d-flex align-items-center justify-content-between mb-3" id="taskViewControls">

        <span class="text-body-secondary" id="taskCount">
            0 tasks
        </span>

        <div class="btn-group" role="group" aria-label="Task views">

            <button type="button" class="btn btn-outline-primary active" id="listViewBtn" data-view="list"
                aria-pressed="true">

                <i class="bi bi-list-ul me-1"></i>
                List

            </button>

            <button type="button" class="btn btn-outline-primary" id="kanbanViewBtn" data-view="kanban"
                aria-pressed="false">

                <i class="bi bi-kanban me-1"></i>
                Kanban

            </button>

        </div>

    </div>

    <!-- TASK LIST VIEW -->
    <div id="taskListView">
        <div class="card">
            <div class="table-responsive">
                <table class="table align-middle mb-0">

                    <thead class="table-light">
                        <tr>
                            <th>Task</th>
                            <th>Project</th>
                            <th>Priority</th>
                            <th>Status</th>
                            <th>Due Date</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>

                    <tbody id="taskList">

                        <!-- TEMPORARY TASK PREVIEW -->
                        <tr>
                            <td>
                                <div class="fw-semibold">Build application layout</div>
                                <small class="text-body-secondary">
                                    Create the responsive app shell.
                                </small>
                            </td>

                            <td>Devnizer</td>

                            <td>
                                <span class="badge text-bg-danger">High</span>
                            </td>

                            <td>
                                <span class="badge text-bg-success">Done</span>
                            </td>

                            <td>Dec 15, 2026</td>

                            <td>
                                <div class="d-flex justify-content-end gap-2">
                                    <button type="button" class="btn btn-sm btn-outline-primary" data-action="view"
                                        aria-label="View task">
                                        <i class="bi bi-eye"></i>
                                    </button>

                                    <button type="button" class="btn btn-sm btn-outline-secondary" data-action="edit"
                                        aria-label="Edit task">
                                        <i class="bi bi-pencil"></i>
                                    </button>

                                    <button type="button" class="btn btn-sm btn-outline-danger" data-action="delete"
                                        aria-label="Delete task">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>

                    </tbody>

                </table>
            </div>
        </div>
    </div>

    <!-- TASK KANBAN VIEW -->
    <div id="taskKanbanView" class="d-none">
        <div class="row g-3">

            <!-- TO DO COLUMN -->
            <div class="col-12 col-lg-4">
                <div class="card kanban-column h-100">

                    <div class="card-header bg-body d-flex align-items-center justify-content-between">
                        <h6 class="mb-0">
                            <i class="bi bi-circle text-secondary me-2"></i>
                            To Do
                        </h6>

                        <span class="badge text-bg-secondary" id="kanbanTodoCount">
                            1
                        </span>
                    </div>

                    <div class="card-body kanban-list" id="kanbanTodo" data-status="todo">
                        <!-- Todo Content -->
                    </div>
                </div>
            </div>

            <!-- IN PROGRESS COLUMN -->
            <div class="col-12 col-lg-4">
                <div class="card kanban-column h-100">

                    <div class="card-header bg-body d-flex align-items-center justify-content-between">
                        <h6 class="mb-0">
                            <i class="bi bi-hourglass-split text-primary me-2"></i>
                            In Progress
                        </h6>

                        <span class="badge text-bg-primary" id="kanbanProgressCount">
                            1
                        </span>
                    </div>

                    <div class="card-body kanban-list" id="kanbanProgress" data-status="in-progress">
                        <!-- In Progress Content -->
                    </div>
                </div>
            </div>

            <!-- DONE COLUMN -->
            <div class="col-12 col-lg-4">
                <div class="card kanban-column h-100">

                    <div class="card-header bg-body d-flex align-items-center justify-content-between">
                        <h6 class="mb-0">
                            <i class="bi bi-check-circle text-success me-2"></i>
                            Done
                        </h6>

                        <span class="badge text-bg-success" id="kanbanDoneCount">
                            1
                        </span>
                    </div>

                    <div class="card-body kanban-list" id="kanbanDone" data-status="done">
                        <!-- Done Content -->
                    </div>
                </div>
            </div>

        </div>
    </div>

</section>
